version: '3.8'

services:
  # --- DATABASE (PostgreSQL 16) ---
  # Configurato con wal_level=logical per permettere a Debezium di leggere il WAL
  postgres:
    image: postgres:16-alpine
    container_name: aurapay-postgres
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aurapay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Lo script init.sql configurerà gli schemi separati per ciascun microservizio
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aurapay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CACHE & IDEMPOTENZA (Redis 7) ---
  redis:
    image: redis:7-alpine
    container_name: aurapay-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APACHE KAFKA (KRaft mode - No Zookeeper) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aurapay-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- DEBEZIUM (Kafka Connect) ---
  # Utilizzato per catturare i dati modificati (CDC) dall'outbox table di Postgres e inviarli a Kafka
  debezium:
    image: debezium/connect:2.5
    container_name: aurapay-debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- STORAGE OGGETTI (MinIO - S3 Compatible) ---
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aurapay-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DISTRIBUTED TRACING (Zipkin) ---
  zipkin:
    image: openzipkin/zipkin:3
    container_name: aurapay-zipkin
    ports:
      - "9411:9411"

  # --- BANK SIMULATOR (Session 3) ---
  bank-simulator:
    build:
      context: .
      dockerfile: aura-bank-simulator/Dockerfile
    container_name: aurapay-bank-simulator
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BANK_SIMULATED_LATENCY_MS: 100
    depends_on:
      kafka:
        condition: service_healthy

  # --- API GATEWAY (Session 3) ---
  api-gateway:
    build:
      context: .
      dockerfile: aura-api-gateway/Dockerfile
    container_name: aurapay-api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICES_BANK_URL: http://bank-simulator:8086
      SERVICES_VAULT_URL: http://vault-service:8084
    depends_on:
      redis:
        condition: service_healthy
      bank-simulator:
        condition: service_started
      vault-service:
        condition: service_started

  # --- KMS (HashiCorp Vault - Session 4) ---
  vault:
    image: hashicorp/vault:1.15
    container_name: aurapay-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "my-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  # --- VAULT SERVICE (Session 4) ---
  vault-service:
    build:
      context: .
      dockerfile: aura-vault-service/Dockerfile
    container_name: aurapay-vault-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aura_vault_db
      SPRING_DATASOURCE_USERNAME: aura_user
      SPRING_DATASOURCE_PASSWORD: aura_password
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: my-root-token
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started

  # --- INVOICE SERVICE (Session 9) ---
  invoice-service:
    build:
      context: .
      dockerfile: aura-invoice-service/Dockerfile
    container_name: aurapay-invoice-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aura_invoice_db
      SPRING_DATASOURCE_USERNAME: aura_user
      SPRING_DATASOURCE_PASSWORD: aura_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET: aurapay-invoices
      PRESIGNED_URL_SECRET: aura-presigned-url-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy


volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
