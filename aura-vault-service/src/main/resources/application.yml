server:
  port: 8084

spring:
  application:
    name: aura-vault-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aura_vault_db}
    username: ${SPRING_DATASOURCE_USERNAME:aura_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aura_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

aurapay:
  vault:
    vault-url: ${VAULT_URL:http://localhost:8200}
    vault-token: ${VAULT_TOKEN:my-root-token}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
