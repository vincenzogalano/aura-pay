server:
  port: 0

spring:
  application:
    name: aura-payment-orchestrator-test
  datasource:
    url: jdbc:h2:mem:orchestratordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never

aurapay:
  services:
    vault-url: http://localhost:8084
    bank-simulator-url: http://localhost:8086
