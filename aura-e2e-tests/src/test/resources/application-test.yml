spring:
  application:
    name: aura-e2e-tests
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:aurapay_e2edb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

aurapay:
  security:
    hmac-secret: TestSuperSecretHmacKeyForE2ETesting32CharsLong!
    jwt-secret: TestSuperSecretJwtKeyForE2ETesting32CharsLong!
  vault:
    vault-url: http://localhost:8200
    vault-token: root
  services:
    vault-url: http://localhost:8084
    bank-simulator-url: http://localhost:8081
