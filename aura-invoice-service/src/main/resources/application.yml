server:
  port: 8088

spring:
  application:
    name: aura-invoice-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aura_invoice_db}
    username: ${SPRING_DATASOURCE_USERNAME:aura_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aura_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: invoice-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

aurapay:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio_admin}
    secret-key: ${MINIO_SECRET_KEY:minio_password}
    bucket: ${MINIO_BUCKET:aurapay-invoices}
  presigned-url:
    secret-key: ${PRESIGNED_URL_SECRET:aura-presigned-url-secret-key-2026}
    expiration-minutes: 15
    base-url: ${INVOICE_DOWNLOAD_BASE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
