server:
  port: 0

spring:
  application:
    name: aura-invoice-service
  datasource:
    url: jdbc:h2:mem:aura_invoice_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

aurapay:
  minio:
    endpoint: http://localhost:9000
    access-key: test_access_key
    secret-key: test_secret_key
    bucket: test-bucket
  presigned-url:
    secret-key: test-presigned-url-secret-key
    expiration-minutes: 15
    base-url: http://localhost:8088
